[workspace]
resolver = "2"
members = [
    "crates/field",
    "crates/poly",
    "crates/toystark",
    "crates/isa",
    "crates/air",
    "crates/merkle",
    "crates/fri",
    "crates/transcript",
    "crates/prover",
    "crates/verifier",
    "crates/viz-export",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"
authors = ["Srishti Rathi"]

[workspace.lints.rust]

[profile.dev]
opt-level = 1