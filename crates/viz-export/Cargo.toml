[package]
name = "viz-export"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Phase 8 support: exports JSON artifacts (trace/air/lde/fri_rounds/proof) from the real pipeline for the web visualizers to consume."

[dependencies]
field = { path = "../field" }
poly = { path = "../poly" }
isa = { path = "../isa" }
air = { path = "../air" }
merkle = { path = "../merkle" }
fri = { path = "../fri" }
transcript = { path = "../transcript" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
